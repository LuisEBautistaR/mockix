# Release on a version tag (v0.2.0) or by hand:
#   - Windows installer (NSIS) + latest.yml for auto-update, into a draft release
#   - optional Authenticode signing with SignPath (when its secrets exist)
#   - the CLI on npm (when NPM_TOKEN exists)
#   - the Docker image on ghcr.io
# Every publishing step is guarded by its secret, so a fork or a repo without
# them only builds.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Instalador
        working-directory: apps/desktop
        run: npx electron-builder --win --publish never
      - name: Subir el instalador sin firmar
        id: unsigned
        uses: actions/upload-artifact@v4
        with:
          name: installer-unsigned
          path: apps/desktop/release/*/Mockix-*-setup.exe
      - name: Firmar con SignPath
        if: env.SIGNPATH_API_TOKEN != ''
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: mockix
          signing-policy-slug: release-signing
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: apps/desktop/release/signed
      - name: Borrador de release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd apps/desktop/release
          version=${GITHUB_REF_NAME#v}
          setup=$(ls signed/Mockix-*-setup.exe 2>/dev/null || ls "$version"/Mockix-*-setup.exe)
          gh release create "$GITHUB_REF_NAME" --draft --title "Mockix $version" --notes "Ver README" \
            "$setup" "$version"/Mockix-*-setup.exe.blockmap "$version"/latest.yml

  npm:
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run pack:cli
      - name: Publicar en npm
        if: env.NPM_TOKEN != '' && startsWith(github.ref, 'refs/tags/')
        working-directory: packages/cli/npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node packages/cli/scripts/bundle.mjs
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ startsWith(github.ref, 'refs/tags/') }}
          tags: |
            ghcr.io/luisebautistar/mockix:${{ github.ref_name }}
            ghcr.io/luisebautistar/mockix:latest
