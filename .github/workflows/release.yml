# Two moments, so nothing goes public before the release does:
#   - By hand (workflow_dispatch) on a version tag: builds the Windows installer
#     (NSIS) + latest.yml, signs it with SignPath when its secrets exist, and
#     leaves it in a draft release to review. On a branch it only builds.
#   - When a release is published (from that draft, or created already
#     published with `gh release create`): the CLI goes to npm (when NPM_TOKEN
#     exists) and the Docker image to ghcr.io.
# Pushing a tag alone runs nothing.
name: release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  installer:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Instalador
        working-directory: apps/desktop
        run: npx electron-builder --win --publish never
      - name: Subir el instalador sin firmar
        id: unsigned
        uses: actions/upload-artifact@v4
        with:
          name: installer-unsigned
          path: apps/desktop/release/*/Mockix-*-setup.exe
      - name: Firmar con SignPath
        if: env.SIGNPATH_API_TOKEN != ''
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: mockix
          signing-policy-slug: release-signing
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: apps/desktop/release/signed
      - name: Borrador de release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd apps/desktop/release
          version=${GITHUB_REF_NAME#v}
          setup=$(ls signed/Mockix-*-setup.exe 2>/dev/null || ls "$version"/Mockix-*-setup.exe)
          gh release create "$GITHUB_REF_NAME" --draft --title "Mockix $version" --notes "Ver README" \
            "$setup" "$version"/Mockix-*-setup.exe.blockmap "$version"/latest.yml

  npm:
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run pack:cli
      - name: Publicar en npm
        if: env.NPM_TOKEN != '' && github.event_name == 'release' && !github.event.release.prerelease
        working-directory: packages/cli/npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node packages/cli/scripts/bundle.mjs
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'release'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'release' }}
          # A prerelease gets its own tag but never moves latest.
          tags: |
            ghcr.io/luisebautistar/mockix:${{ github.ref_name }}
            ${{ github.event.release.prerelease && '' || 'ghcr.io/luisebautistar/mockix:latest' }}
