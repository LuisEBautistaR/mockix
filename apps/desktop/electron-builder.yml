appId: digital.protohub.mockix
productName: Mockix
copyright: Copyright © 2026 Luis E. Bautista
directories:
  output: release/${version}
  buildResources: build
files:
  - out/**
  - package.json
asar: true
# Everything the app runs is bundled into out/ by electron-vite: nothing to rebuild.
npmRebuild: false

# Electron fuses, flipped in the packaged binary (see README, Seguridad).
electronFuses:
  runAsNode: false                            # mock hosts are utilityProcesses, not ELECTRON_RUN_AS_NODE
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  grantFileProtocolExtraPrivileges: false     # the UI is served from app://, never file://

# Icon and version info go into Mockix.exe in this hook instead of electron-builder's
# signAndEditExecutable step, which fails here on a transient file lock (see the hook).
afterPack: build/after-pack.cjs

# mockix://import?… (Sendix's "crear mock desde esta colección"); registered by the installer.
protocols:
  - name: Mockix
    schemes: [mockix]

# Auto-update from GitHub Releases (electron-updater). The app checks on start and from Ajustes.
publish:
  provider: github
  owner: LuisEBautistaR
  repo: mockix
  releaseType: release

win:
  signAndEditExecutable: false
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
  artifactName: Mockix-${version}-setup.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: Mockix
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  deleteAppDataOnUninstall: false
  include: build/installer.nsh
